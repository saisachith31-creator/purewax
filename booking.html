<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order PureWax</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f4c75, #3282b8);
      padding-top: 120px;
    }

    .booking-wrapper {
      max-width: 760px;
      margin: 0 auto 80px;
      background: #ffffff;
      border-radius: 14px;
      padding: 50px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    }

    h1 { text-align: center; }
    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 35px;
    }

    label {
      font-weight: 600;
      margin-top: 20px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    .qty-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .qty-row button {
      padding: 10px 16px;
      font-size: 18px;
      cursor: pointer;
    }

    .price-box {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 700;
      color: #0f4c75;
    }

    .action-btn {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .whatsapp-btn {
      background: #25d366;
      color: #fff;
    }

    .confirm-box {
      display: none;
      margin-top: 30px;
      padding: 25px;
      background: #f1f8ff;
      border-radius: 10px;
      text-align: center;
    }
  </style>

  <script>
    const prices = {
      "PureWax Waterless Wash (16oz)": 29,
      "PureWax Microfiber Cloth (2pcs)": 12,
      "PureWax Anti-Bacterial Spray (16oz)": 19,
      "Combo Pack (Wash + Cloth)": 39,
      "Twin Pack (2x Wash)": 55,
      "Family Pack (2x Wash + Cloth + Sanitiser)": 79
    };

    function updatePrice() {
      const product = document.getElementById("product").value;
      const qty = document.getElementById("quantity").value;
      document.getElementById("totalPrice").innerText =
        "Total: SGD $" + (prices[product] * qty);
    }

    function sendWhatsApp() {
      const name = nameInput.value;
      const phone = phoneInput.value;
      const product = productSelect.value;
      const qty = quantity.value;
      const location = locationInput.value;
      const total = prices[product] * qty;

      if (!name || !phone) {
        alert("Please fill in name and phone number.");
        return;
      }

      const msg =
        "PureWax Order%0A%0A" +
        "Name: " + name + "%0A" +
        "Phone: " + phone + "%0A" +
        "Product: " + product + "%0A" +
        "Quantity: " + qty + "%0A" +
        "Total: SGD $" + total + "%0A" +
        "Delivery: " + location;

      window.open("https://wa.me/6590040534?text=" + msg, "_blank");

      orderSummary.innerHTML =
        "<b>Product:</b> " + product + "<br>" +
        "<b>Quantity:</b> " + qty + "<br>" +
        "<b>Total:</b> SGD $" + total;

      confirmBox.style.display = "block";
    }
  </script>
</head>

<body>

<div class="navbar">
  <div class="logo">PureWax</div>
  <div class="nav-links">
    <a href="index.html">🏠 Home</a>
    <a href="about.html">About</a>
    <a href="how-to-use.html">How to Use</a>
    <a href="guide.html">Guide</a>
    <a href="booking.html">Booking</a>
    <a href="contact.html">Contact</a>
  </div>
</div>

<div class="booking-wrapper">
  <h1>Order PureWax</h1>
  <p class="subtitle">Premium waterless car care products</p>

  <label>Full Name</label>
  <input id="nameInput">

  <label>Phone Number</label>
  <input id="phoneInput">

  <label>Product</label>
  <select id="productSelect" onchange="updatePrice()">
    <option>PureWax Waterless Wash (16oz)</option>
    <option>PureWax Microfiber Cloth (2pcs)</option>
    <option>PureWax Anti-Bacterial Spray (16oz)</option>
    <option>Combo Pack (Wash + Cloth)</option>
    <option>Twin Pack (2x Wash)</option>
    <option>Family Pack (2x Wash + Cloth + Sanitiser)</option>
  </select>

  <label>Quantity</label>
  <div class="qty-row">
    <button onclick="quantity.stepDown(); updatePrice()">−</button>
    <input type="number" id="quantity" value="1" min="1" onchange="updatePrice()">
    <button onclick="quantity.stepUp(); updatePrice()">+</button>
  </div>

  <div class="price-box" id="totalPrice">Total: SGD $29</div>

  <label>Delivery Location</label>
  <input id="locationInput">

  <button class="action-btn whatsapp-btn" onclick="sendWhatsApp()">
    SEND ORDER TO WHATSAPP
  </button>

  <div class="confirm-box" id="confirmBox">
    <h3>Order Sent ✅</h3>
    <div id="orderSummary"></div>
  </div>
</div>

</body>
</html>
