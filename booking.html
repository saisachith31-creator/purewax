<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order PureWax</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f4c75, #3282b8);
      padding-top: 120px;
    }

    .booking-wrapper {
      max-width: 760px;
      margin: 0 auto 80px;
      background: #ffffff;
      border-radius: 14px;
      padding: 50px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 35px;
    }

    label {
      font-weight: 600;
      margin-top: 20px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    .qty-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .qty-row button {
      padding: 10px 16px;
      font-size: 18px;
      cursor: pointer;
    }

    .price-box {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 700;
      color: #0f4c75;
    }

    .action-btn {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .whatsapp-btn {
      background: #25d366;
      color: #ffffff;
    }

    .confirm-box {
      display: none;
      margin-top: 30px;
      padding: 25px;
      background: #f1f8ff;
      border-radius: 10px;
      text-align: center;
    }
  </style>

  <script>
    const prices = {
      "PureWax Waterless Wash (16oz)": 31,
      "PureWax Microfiber Cloth (2pcs)": 14,
      "PureWax Anti-Bacterial Spray (16oz)": 21,
      "Combo Pack (Wash + Cloth)": 42,
      "Twin Pack (2x Wash)": 58,
      "Family Pack (2x Wash + Cloth + Sanitiser)": 89
    };

    function updatePrice() {
      const product = document.getElementById("product").value;
      const qty = document.getElementById("quantity").value;
      const total = prices[product] * qty;

      document.getElementById("totalPrice").innerText =
        "Total: SGD $" + total;
    }

    function sendWhatsApp() {
      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const product = document.getElementById("product").value;
      const qty = document.getElementById("quantity").value;
      const location = document.getElementById("location").value;
      const total = prices[product] * qty;

      if (!name || !phone) {
        alert("Please fill in your name and phone number.");
        return;
      }

      const message =
        "PureWax Order%0A%0A" +
        "Name: " + name + "%0A" +
        "Phone: " + phone + "%0A" +
        "Product: " + product + "%0A" +
        "Quantity: " + qty + "%0A" +
        "Total: SGD $" + total + "%0A" +
        "Delivery Location: " + location;

      window.open(
        "https://wa.me/6590040534?text=" + message,
        "_blank"
      );

      document.getElementById("orderSummary").innerHTML =
        "<strong>Product:</strong> " + product + "<br>" +
        "<strong>Quantity:</strong> " + qty + "<br>" +
        "<strong>Total:</strong> SGD $" + total;

      document.getElementById("confirmBox").style.display = "block";
    }
  </script>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">PureWax</div>
  <div class="nav-links">
    <a href="index.html">🏠 Home</a>
    <a href="about.html">About</a>
    <a href="how-to-use.html">How to Use</a>
    <a href="guide.html">Guide</a>
    <a href="booking.html">Booking</a>
    <a href="contact.html">Contact</a>
  </div>
</div>

<!-- BOOKING PAGE -->
<div class="booking-wrapper">
  <h1>Order PureWax</h1>
  <p class="subtitle">Premium waterless car care products</p>

  <label>Full Name</label>
  <input id="name" placeholder="Your name">

  <label>Phone Number</label>
  <input id="phone" placeholder="Your phone number">

  <label>Product</label>
  <select id="product" onchange="updatePrice()">
    <option>PureWax Waterless Wash (16oz)</option>
    <option>PureWax Microfiber Cloth (2pcs)</option>
    <option>PureWax Anti-Bacterial Spray (16oz)</option>
    <option>Combo Pack (Wash + Cloth)</option>
    <option>Twin Pack (2x Wash)</option>
    <option>Family Pack (2x Wash + Cloth + Sanitiser)</option>
  </select>

  <label>Quantity</label>
  <div class="qty-row">
    <button onclick="document.getElementById('quantity').stepDown(); updatePrice()">−</button>
    <input type="number" id="quantity" value="1" min="1" onchange="updatePrice()">
    <button onclick="document.getElementById('quantity').stepUp(); updatePrice()">+</button>
  </div>

  <div class="price-box" id="totalPrice">Total: SGD $31</div>

  <label>Delivery Location</label>
  <input id="location" placeholder="Address / area">

  <button class="action-btn whatsapp-btn" onclick="sendWhatsApp()">
    SEND ORDER TO WHATSAPP
  </button>

  <div class="confirm-box" id="confirmBox">
    <h3>Order Sent ✅</h3>
    <p>Your order has been sent to WhatsApp.</p>
    <div id="orderSummary"></div>
  </div>
</div>

</body>
</html>
